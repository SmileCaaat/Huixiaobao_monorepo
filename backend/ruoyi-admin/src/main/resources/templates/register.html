<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>消防设备管理系统 - 员工注册</title>
    <meta name="description" content="消防设备管理系统">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet" />
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet" />
    <link href="../static/ruoyi/css/ry-ui.css" th:href="@{/ruoyi/css/ry-ui.css?v=4.8.2}" rel="stylesheet" />
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}" />
    <style>
        /* Register page: align with login.html centering & card size; keep denser form for field count */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 10% 20%, rgba(220, 53, 69, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(253, 126, 20, 0.15) 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes backgroundPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .register-scale {
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            margin: auto 0;
        }
        .login-container {
            display: flex;
            width: 100%;
            min-height: 550px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 50%, #a71d2a 100%);
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .login-left::before {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 100%; height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: rotateGradient 15s linear infinite;
        }
        @keyframes rotateGradient { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .login-left-content { position: relative; z-index: 1; }
        .login-left .fire-icon {
            font-size: 64px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 20px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            animation: fireGlow 2s ease-in-out infinite;
        }
        @keyframes fireGlow {
            0%, 100% { text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2), 0 0 30px rgba(255, 193, 7, 0.3); }
            50% { text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2), 0 0 50px rgba(255, 193, 7, 0.6); }
        }
        .login-left h1 { font-size: 28px; font-weight: 700; color: white; margin-bottom: 12px; }
        .login-left p { font-size: 14px; color: rgba(255, 255, 255, 0.9); line-height: 1.7; margin-bottom: 22px; }
        .login-left .features { list-style: none; }
        .login-left .features li {
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .login-left .features li i { margin-right: 12px; font-size: 16px; color: #ffc107; }
        .login-right {
            flex: 1.15;
            padding: 28px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .login-right h2 { font-size: 26px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .login-right .subtitle { color: #6c757d; margin-bottom: 16px; font-size: 13px; }
        .org-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 2px;
        }
        .form-group { margin-bottom: 12px; position: relative; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #333; margin-bottom: 5px; }
        .input-wrapper { position: relative; }
        .input-wrapper > i.field-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #adb5bd; font-size: 15px; transition: color 0.3s; pointer-events: none;
        }
        .input-wrapper input, .input-wrapper .readonly-box {
            width: 100%; padding: 11px 16px 11px 40px; border: 2px solid #e9ecef;
            border-radius: 10px; font-size: 14px; transition: all 0.3s; background: #f8f9fa; color: #333;
            word-break: break-word;
        }
        .input-wrapper .readonly-box {
            min-height: 42px; display: flex; align-items: center; line-height: 1.35;
            color: #495057; background: #eef1f4; cursor: default;
        }
        .input-wrapper input:focus {
            border-color: #dc3545; background: white; outline: none;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.1);
        }
        .input-wrapper input:focus + i.field-icon,
        .input-wrapper:focus-within > i.field-icon { color: #dc3545; }
        .input-wrapper .pwd-toggle {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            color: #adb5bd; cursor: pointer; font-size: 15px; z-index: 2;
        }
        .input-wrapper .pwd-toggle:hover { color: #dc3545; }
        .input-wrapper input.has-toggle { padding-right: 42px; }
        .captcha-wrapper { display: flex; gap: 12px; align-items: stretch; }
        .captcha-wrapper .input-wrapper { flex: 1; }
        .captcha-wrapper img {
            height: 44px; border-radius: 10px; cursor: pointer; border: 2px solid #e9ecef; transition: transform 0.3s;
        }
        .captcha-wrapper img:hover { transform: scale(1.05); }
        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4); margin-top: 6px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(220, 53, 69, 0.5); }
        .back-login { text-align: center; margin-top: 14px; font-size: 14px; color: #6c757d; }
        .back-login a { color: #dc3545; text-decoration: none; font-weight: 600; }
        .back-login a:hover { text-decoration: underline; color: #c82333; }
        .beian-info {
            text-align: center; color: rgba(255, 255, 255, 0.8); font-size: 12px;
            line-height: 1.8; margin-top: 16px; z-index: 2; position: relative; width: 100%;
        }
        .beian-info a { color: rgba(255, 255, 255, 0.8); text-decoration: none; }
        .beian-info a:hover { color: #fff; text-decoration: underline; }
        label.error { position: inherit; color: #dc3545; font-size: 12px; margin-top: 4px; }
        .invite-tip { font-size: 12px; color: #868e96; margin-top: 3px; }
        @media (max-width: 768px) {
            .login-container { flex-direction: column; min-height: auto; width: 100%; }
            .login-left { padding: 28px; }
            .login-left .fire-icon { font-size: 48px; }
            .login-left h1 { font-size: 22px; }
            .login-left .features { display: none; }
            .login-right { padding: 24px 20px; }
            .org-grid { grid-template-columns: 1fr; }
        }
        /* Keep vertical center like login; only compact spacing on short viewports */
        @media (max-height: 780px) {
            body { padding-top: 12px; padding-bottom: 12px; }
            .login-left .features { display: none; }
            .login-container { min-height: 0; }
            .login-left { padding: 28px 24px; }
            .login-right { padding: 22px 28px; }
            .beian-info { margin-top: 12px; }
        }
    </style>
</head>

<body>
    <div class="register-scale">
    <div class="login-container">
        <div class="login-left">
            <div class="login-left-content">
                <i class="fa fa-fire fire-icon"></i>
                <h1>消防设备管理系统</h1>
                <p>全方位消防设备监控与管理解决方案，保障您的消防安全。</p>
                <ul class="features">
                    <li><i class="fa fa-building-o"></i> 建筑信息智能管理</li>
                    <li><i class="fa fa-fire-extinguisher"></i> 消防设备全生命周期管理</li>
                    <li><i class="fa fa-bell-o"></i> 实时预警与故障提醒</li>
                    <li><i class="fa fa-bar-chart"></i> 数据统计与可视化分析</li>
                    <li><i class="fa fa-shield"></i> 多级权限安全管控</li>
                </ul>
            </div>
        </div>
        <div class="login-right">
            <h2>员工注册</h2>
            <p class="subtitle" id="inviteHint">请填写员工信息完成注册</p>
            <form id="registerForm" autocomplete="off">
                <input type="hidden" name="inviteToken" id="inviteToken" />

                <div class="org-grid" id="orgRow" style="display:none;">
                <div class="form-group" id="orgCompanyGroup" style="display:none; margin-bottom:0;">
                    <label>所属公司</label>
                    <div class="input-wrapper">
                        <div class="readonly-box" id="companyName">-</div>
                        <i class="fa fa-building field-icon"></i>
                    </div>
                </div>
                <div class="form-group" id="orgDeptGroup" style="display:none; margin-bottom:0;">
                    <label>所属部门</label>
                    <div class="input-wrapper">
                        <div class="readonly-box" id="deptName">-</div>
                        <i class="fa fa-sitemap field-icon"></i>
                    </div>
                </div>
                </div>

                <div class="form-group">
                    <label>姓名</label>
                    <div class="input-wrapper">
                        <input type="text" name="userName" placeholder="请输入姓名" maxlength="30" />
                        <i class="fa fa-user field-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <div class="input-wrapper">
                        <input type="text" name="phonenumber" placeholder="请输入手机号（作为登录账号）" maxlength="11" />
                        <i class="fa fa-mobile field-icon"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>登录密码</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="password" class="has-toggle" placeholder="请输入密码（5-20位）" maxlength="20" />
                        <i class="fa fa-lock field-icon"></i>
                        <i class="fa fa-eye pwd-toggle" id="togglePwd" title="显示/隐藏密码"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <div class="input-wrapper">
                        <input type="password" name="confirmPassword" id="confirmPassword" class="has-toggle" placeholder="请再次输入密码" maxlength="20" />
                        <i class="fa fa-lock field-icon"></i>
                        <i class="fa fa-eye pwd-toggle" id="togglePwd2" title="显示/隐藏密码"></i>
                    </div>
                </div>

                <div class="form-group" id="inviteCodeGroup">
                    <label>部门邀请码</label>
                    <div class="input-wrapper">
                        <input type="text" name="inviteCode" id="inviteCode" placeholder="请输入公司或部门提供的注册邀请码" maxlength="16" />
                        <i class="fa fa-key field-icon"></i>
                    </div>
                    <div class="invite-tip">请输入公司或部门提供的注册邀请码</div>
                </div>

                <div class="form-group" th:if="${captchaEnabled==true}">
                    <label>图片验证码</label>
                    <div class="captcha-wrapper">
                        <div class="input-wrapper">
                            <input type="text" name="validateCode" class="code" placeholder="请输入验证码" maxlength="5" />
                            <i class="fa fa-picture-o field-icon"></i>
                        </div>
                        <a href="javascript:void(0);" title="点击更换验证码">
                            <img th:src="@{/captcha/captchaImage(type=${captchaType})}" class="imgcode" />
                        </a>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnSubmit" data-loading="正在注册，请稍候...">
                    <i class="fa fa-user-plus"></i> 注册
                </button>
            </form>
            <div class="back-login">
                <a th:href="@{/login}">返回登录</a>
            </div>
        </div>
    </div>
    <div class="beian-info">
        <div>Copyright © 2026 消防设备管理系统 All Rights Reserved.</div>
        <div style="margin-top: 5px;">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">粤ICP备2026011749号-1</a>
            <span style="margin: 0 8px;">|</span>
            <a href="https://beian.mps.gov.cn/#/query/webSearch?code=44170202000450" rel="noreferrer" target="_blank">粤公网安备44170202000450号</a>
        </div>
    </div>
    </div>
    <script th:inline="javascript">
        var ctx = [[@{/}]];
        var captchaType = [[${captchaType}]];
        var captchaEnabled = [[${captchaEnabled}]];
    </script>
    <script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
    <script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
    <script src="../static/ajax/libs/validate/jquery.validate.extend.js" th:src="@{/ajax/libs/validate/jquery.validate.extend.js}"></script>
    <script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
    <script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
    <script src="../static/ruoyi/js/ry-ui.js" th:src="@{/ruoyi/js/ry-ui.js?v=4.8.2}"></script>
    <script src="../static/ruoyi/register.js" th:src="@{/ruoyi/register.js}"></script>
</body>
</html>
