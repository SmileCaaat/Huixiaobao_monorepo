<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>员工注册</title>
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet" />
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet" />
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet" />
    <link href="../static/ruoyi/css/ry-ui.css" th:href="@{/ruoyi/css/ry-ui.css?v=4.8.2}" rel="stylesheet" />
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}" />
    <style type="text/css">
        label.error { position: inherit; }
        .pwd-wrap { position: relative; }
        .pwd-wrap .fa-eye, .pwd-wrap .fa-eye-slash {
            position: absolute; right: 12px; top: 12px; cursor: pointer; color: #999;
        }
        .org-readonly {
            background: #f5f5f5; padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; color: #333;
        }
        .sms-row .btn { height: 34px; }
    </style>
</head>

<body class="signin">
    <div class="signinpanel">
        <div class="row">
            <div class="col-sm-7">
                <div class="signin-info">
                    <div class="logopanel m-b">
                        <h1><img alt="慧消保" src="../static/ruoyi.png" th:src="@{/ruoyi.png}"></h1>
                    </div>
                    <h4>欢迎注册 <strong>员工账号</strong></h4>
                    <ul class="m-b">
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 扫码或输入邀请码加入部门</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 短信验证手机号</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 可信码自动通过，否则待审</li>
                    </ul>
                    <strong>已经注册过? <a th:href="@{/login}">直接登录&raquo;</a></strong>
                </div>
            </div>
            <div class="col-sm-5">
                <form id="registerForm" autocomplete="off">
                    <h4 class="no-margins">员工注册</h4>
                    <p class="m-t-md text-muted" id="inviteHint">请填写信息完成注册</p>
                    <div id="orgInfo" class="org-readonly" style="display:none;">
                        <div>所属公司：<span id="companyName">-</span></div>
                        <div>所属部门：<span id="deptName">-</span></div>
                    </div>
                    <input type="hidden" name="inviteToken" id="inviteToken" />
                    <input type="text" name="userName" class="form-control uname" placeholder="姓名" maxlength="30" />
                    <input type="text" name="phonenumber" class="form-control uname" placeholder="手机号" maxlength="11" />
                    <div class="row sms-row m-t">
                        <div class="col-xs-7">
                            <input type="text" name="smsCode" class="form-control" placeholder="短信验证码" maxlength="6" />
                        </div>
                        <div class="col-xs-5">
                            <button type="button" class="btn btn-default btn-block" id="btnSms">获取验证码</button>
                        </div>
                    </div>
                    <div class="pwd-wrap m-t">
                        <input type="password" name="password" id="password" class="form-control pword" placeholder="密码" maxlength="20" />
                        <i class="fa fa-eye" id="togglePwd"></i>
                    </div>
                    <div class="pwd-wrap m-t">
                        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control pword" placeholder="确认密码" maxlength="20" />
                        <i class="fa fa-eye" id="togglePwd2"></i>
                    </div>
                    <input type="text" name="inviteCode" id="inviteCode" class="form-control uname m-t" placeholder="邀请码（可选，无二维码时填写）" maxlength="16" />
                    <div class="row m-t" th:if="${captchaEnabled==true}">
                        <div class="col-xs-6">
                            <input type="text" name="validateCode" class="form-control code" placeholder="图片验证码" maxlength="5">
                        </div>
                        <div class="col-xs-6">
                            <a href="javascript:void(0);" title="点击更换验证码">
                                <img th:src="@{/captcha/captchaImage(type=${captchaType})}" class="imgcode" width="85%" />
                            </a>
                        </div>
                    </div>
                    <button class="btn btn-success btn-block m-t" id="btnSubmit" data-loading="正在注册，请稍候...">注册</button>
                    <p class="text-center m-t"><a th:href="@{/login}">返回登录</a></p>
                </form>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        var ctx = [[@{/}]];
        var captchaType = [[${captchaType}]];
        var captchaEnabled = [[${captchaEnabled}]];
    </script>
    <script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
    <script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
    <script src="../static/ajax/libs/validate/jquery.validate.extend.js" th:src="@{/ajax/libs/validate/jquery.validate.extend.js}"></script>
    <script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
    <script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
    <script src="../static/ruoyi/js/ry-ui.js" th:src="@{/ruoyi/js/ry-ui.js?v=4.8.2}"></script>
    <script src="../static/ruoyi/register.js" th:src="@{/ruoyi/register.js}"></script>
</body>
</html>
