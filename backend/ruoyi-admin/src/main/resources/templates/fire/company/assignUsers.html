<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('分配巡检人员')" />
</head>

<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-assign-users">
            <input type="hidden" id="companyId" th:value="${company.companyId}">
            <div class="form-group">
                <label class="col-sm-3 control-label">公司名称：</label>
                <div class="col-sm-8">
                    <p class="form-control-static" th:text="${company.companyName}"></p>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">成员配置：</label>
                <div class="col-sm-8">
                    <div style="max-height: 420px; overflow-y: auto;">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th width="50">参与</th>
                                    <th>用户</th>
                                    <th width="140">职责</th>
                                    <th width="120">业务线</th>
                                    <th width="100">状态</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}"
                                    th:with="assigned=${assignedMap[user.userId]}">
                                    <td>
                                        <input type="checkbox" class="member-check"
                                            th:value="${user.userId}"
                                            th:checked="${assigned != null}">
                                    </td>
                                    <td>
                                        <span th:text="${user.userName}"></span>
                                        <small class="text-muted" th:text="${'(' + user.loginName + ')'}"></small>
                                    </td>
                                    <td>
                                        <select class="form-control input-sm role-type">
                                            <option value="0" th:selected="${assigned != null && assigned.roleType == '0'}">组员</option>
                                            <option value="1" th:selected="${assigned != null && assigned.roleType == '1'}">项目负责人</option>
                                            <option value="2" th:selected="${assigned != null && assigned.roleType == '2'}">客户管理员</option>
                                            <option value="3" th:selected="${assigned != null && assigned.roleType == '3'}">维保组长</option>
                                        </select>
                                    </td>
                                    <td>
                                        <select class="form-control input-sm biz-line">
                                            <option value="all" th:selected="${assigned == null || assigned.bizLine == 'all'}">全部</option>
                                            <option value="inner" th:selected="${assigned != null && assigned.bizLine == 'inner'}">内勤</option>
                                            <option value="outer" th:selected="${assigned != null && assigned.bizLine == 'outer'}">外勤</option>
                                        </select>
                                    </td>
                                    <td>
                                        <select class="form-control input-sm member-status">
                                            <option value="0" th:selected="${assigned == null || assigned.status == '0'}">有效</option>
                                            <option value="1" th:selected="${assigned != null && assigned.status == '1'}">退出</option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="help-block">勾选参与分配的成员；未勾选的用户不会变更现有关联。</p>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "fire/company";

        function submitHandler() {
            var companyId = $("#companyId").val();
            var members = [];
            $("#form-assign-users tbody tr").each(function () {
                var row = $(this);
                var checkbox = row.find(".member-check");
                if (!checkbox.is(":checked")) {
                    return;
                }
                members.push({
                    userId: parseInt(checkbox.val(), 10),
                    roleType: row.find(".role-type").val(),
                    bizLine: row.find(".biz-line").val(),
                    status: row.find(".member-status").val()
                });
            });

            $.ajax({
                type: "POST",
                url: prefix + "/assignUsers",
                data: {
                    companyId: companyId,
                    membersJson: JSON.stringify(members)
                },
                success: function (result) {
                    if (result.code == 0) {
                        $.modal.msgSuccess("分配成功");
                        $.modal.close();
                    } else {
                        $.modal.alertError(result.msg);
                    }
                }
            });
        }
    </script>
</body>

</html>
