<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增巡检测试')" />
    <link th:href="@{/ruoyi/css/fire-inspection-pickers.css}" rel="stylesheet" charset="utf-8"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-inspection-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">单位名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="companyId" name="companyId" required th:disabled="${linkedInspection}">
                        <option value="">请选择</option>
                        <option th:each="company : ${companies}" th:value="${company.companyId}"
                            th:text="${company.companyName}" th:data-name="${company.companyName}"
                            th:data-standard="${company.maintenanceStandard}" th:data-address="${company.address}"
                            th:selected="${linkedInspection and linkedCompany != null and linkedCompany.companyId == company.companyId}"></option>
                    </select>
                    <input th:if="${linkedInspection}" type="hidden" name="companyId" th:value="${linkedCompany.companyId}" />
                    <input type="hidden" id="companyName" name="companyName" />
                    <input type="hidden" id="maintenanceStandard" name="maintenanceStandard" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">维保类型：</label>
                <div class="col-sm-8">
                    <div class="radio-box" th:each="dict : ${@dict.getType('fire_inspection_type')}">
                        <input type="radio" name="inspectionType" th:value="${dict.dictValue}"
                            th:id="${'inspectionType_'+dict.dictValue}"
                            th:checked="${dict.isDefault == 'Y' ? true : false}">
                        <label th:for="${'inspectionType_'+dict.dictValue}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">建筑名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="buildingId" name="buildingId" required>
                        <option value="">请先选择单位</option>
                    </select>
                    <input type="hidden" id="buildingName" name="buildingName" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">所在楼层：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control insp-picker-trigger" id="floorDisplay" placeholder="请选择" readonly>
                    <input type="hidden" id="floor" name="floor">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">系统名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="categoryKey" name="categoryKey" required th:disabled="${linkedInspection}">
                        <option value="">请选择</option>
                        <option th:each="type : ${systemTypes}" th:value="${type.categoryKey}"
                            th:data-name="${type.categoryName}" th:text="${type.categoryName}"
                            th:selected="${linkedInspection and linkedTemplateCategory != null and linkedTemplateCategory.categoryKey == type.categoryKey}"></option>
                    </select>
                    <input th:if="${linkedInspection}" type="hidden" name="categoryKey" th:value="${linkedTemplateCategory.categoryKey}" />
                    <input type="hidden" id="systemName" name="systemName" />
                    <input type="hidden" id="systemType" name="systemType" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">设备名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="equipmentKey" name="equipmentKey" required th:disabled="${linkedInspection}">
                        <option value="">请先选择系统名称</option>
                        <option th:if="${linkedInspection and linkedTemplateEquipment != null}"
                            th:value="${linkedTemplateEquipment.equipmentKey}"
                            th:text="${linkedTemplateEquipment.equipmentName}"
                            th:data-name="${linkedTemplateEquipment.equipmentName}" selected></option>
                    </select>
                    <input th:if="${linkedInspection}" type="hidden" name="equipmentKey" th:value="${linkedTemplateEquipment.equipmentKey}" />
                    <input type="hidden" id="equipmentName" name="equipmentName" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">设备数量：</label>
                <div class="col-sm-8">
                    <input type="number" name="equipmentCount" class="form-control" value="1" min="1" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">具体位置：</label>
                <div class="col-sm-8">
                    <input type="text" name="location" class="form-control" placeholder="请输入具体位置" maxlength="200" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">巡检时间：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control insp-picker-trigger" id="inspectionDateDisplay" placeholder="请选择" readonly>
                    <input type="hidden" name="inspectionTime" id="inspectionTime">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">设备状态：</label>
                <div class="col-sm-8">
                    <div class="onoffswitch">
                        <input type="checkbox" class="onoffswitch-checkbox" id="equipmentStatusSwitch" checked>
                        <label class="onoffswitch-label" for="equipmentStatusSwitch">
                            <span class="onoffswitch-inner"></span>
                            <span class="onoffswitch-switch"></span>
                        </label>
                    </div>
                    <input type="hidden" name="equipmentStatus" id="equipmentStatus" value="0">
                    <span id="statusText" style="margin-left: 10px; color: green;">正常</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">详细备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="3" maxlength="300" placeholder="请输入详细备注"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">现场图片：</label>
                <div class="col-sm-8">
                    <input type="hidden" name="imageUrls" id="imageUrls">
                    <input type="file" id="simpleUpload" multiple accept="image/*" class="form-control">
                    <small class="help-block">支持jpg、jpeg、png、gif格式，最多上传5张图片</small>
                    <div id="preview" style="margin-top:10px;"></div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:src="@{/ruoyi/js/fire-inspection-pickers.js}" charset="utf-8"></script>
    <script th:inline="javascript">
        var prefix = ctx + "fire/inspection";
        var linkedInspection = [[${linkedInspection}]];
        var linkedCompanyId = /*[[${linkedInspection ? linkedCompany.companyId : null}]]*/ null;
        var linkedCategoryKey = /*[[${linkedInspection ? linkedTemplateCategory.categoryKey : ''}]]*/ '';
        var linkedCategoryName = /*[[${linkedInspection ? linkedTemplateCategory.categoryName : ''}]]*/ '';
        var linkedEquipmentKey = /*[[${linkedInspection ? linkedTemplateEquipment.equipmentKey : ''}]]*/ '';
        var linkedEquipmentName = /*[[${linkedInspection ? linkedTemplateEquipment.equipmentName : ''}]]*/ '';
        var linkedBuildingId = /*[[${linkedInspection ? linkedBuildingId : null}]]*/ null;
        var linkedBuildingName = /*[[${linkedInspection ? linkedBuildingName : ''}]]*/ '';
        var linkedCustomerAddress = /*[[${linkedInspection ? linkedCompany.address : ''}]]*/ '';

        function loadBuildings(companyId, selectedId, selectedName) {
            $("#buildingId").html('<option value="">请选择</option>');
            $("#buildingName").val('');
            if (!companyId) {
                return;
            }
            $.get(prefix + "/buildings/" + companyId, function (res) {
                if (res.code == 0 || res.code == 200) {
                    var list = res.data || [];
                    var html = '<option value="">请选择</option>';
                    var autoId = selectedId;
                    if ((!autoId || autoId === 'null') && list.length === 1) {
                        autoId = list[0].buildingId;
                    }
                    for (var i = 0; i < list.length; i++) {
                        var selected = autoId && String(autoId) === String(list[i].buildingId) ? ' selected' : '';
                        html += '<option value="' + list[i].buildingId + '" data-name="' + list[i].buildingName + '"' + selected + '>' + list[i].buildingName + '</option>';
                    }
                    $("#buildingId").html(html);
                    if (autoId) {
                        var name = $("#buildingId option:selected").data("name") || selectedName || '';
                        $("#buildingName").val(name);
                    }
                }
            });
        }

        function loadEquipmentTypes(categoryKey, selectedKey) {
            $("#equipmentKey").html('<option value="">请选择</option>');
            $("#equipmentName").val('');
            if (!categoryKey) {
                $("#equipmentKey").html('<option value="">请先选择系统名称</option>');
                return;
            }
            $.get(prefix + "/equipmentTypes", { categoryKey: categoryKey }, function (res) {
                if (res.code == 0 || res.code == 200) {
                    var list = res.data || [];
                    var html = '<option value="">请选择</option>';
                    for (var i = 0; i < list.length; i++) {
                        var selected = selectedKey && selectedKey == list[i].equipmentKey ? ' selected' : '';
                        html += '<option value="' + list[i].equipmentKey + '" data-name="' + list[i].equipmentName + '"' + selected + '>' + list[i].equipmentName + '</option>';
                    }
                    $("#equipmentKey").html(html);
                    if (selectedKey) {
                        $("#equipmentName").val($("#equipmentKey option:selected").data("name") || '');
                    }
                }
            });
        }

        $(function () {
            FireInspectionPickers.initFloorPicker({
                trigger: '#floorDisplay',
                hidden: '#floor',
                mount: $('body')
            });
            FireInspectionPickers.initDatePicker({
                trigger: '#inspectionDateDisplay',
                hidden: '#inspectionTime',
                mount: $('body'),
                defaultNow: true
            });

            if (linkedInspection) {
                $('#companyName').val($('#companyId option:selected').data('name') || '');
                $('#maintenanceStandard').val($('#companyId option:selected').data('standard') || '');
                $('#systemName').val(linkedCategoryName);
                $('#systemType').val(linkedCategoryKey);
                $('#equipmentName').val(linkedEquipmentName);
                $('input[name="inspectionType"][value="0"]').prop('checked', true);
                loadBuildings(linkedCompanyId, linkedBuildingId, linkedBuildingName);
            }

            $("#companyId").change(function () {
                var opt = $(this).find("option:selected");
                $("#companyName").val(opt.data("name") || '');
                $("#maintenanceStandard").val(opt.data("standard") || '');
                loadBuildings($(this).val());
            });

            $("#buildingId").change(function () {
                $("#buildingName").val($(this).find("option:selected").data("name") || '');
            });

            $("#categoryKey").change(function () {
                var opt = $(this).find("option:selected");
                var key = $(this).val() || '';
                $("#systemName").val(opt.data("name") || '');
                $("#systemType").val(key);
                $("#equipmentKey").val('');
                $("#equipmentName").val('');
                loadEquipmentTypes(key);
            });

            $("#equipmentKey").change(function () {
                $("#equipmentName").val($(this).find("option:selected").data("name") || '');
            });

            $("#equipmentStatusSwitch").change(function () {
                if ($(this).is(":checked")) {
                    $("#equipmentStatus").val("0");
                    $("#statusText").text("正常").css("color", "green");
                } else {
                    $("#equipmentStatus").val("1");
                    $("#statusText").text("异常").css("color", "red");
                    if (linkedInspection) {
                        askReportFault();
                    }
                }
            });

            $("#simpleUpload").change(function () {
                var files = this.files;
                $("#preview").html('');
                for (var i = 0; i < files.length; i++) {
                    $("#preview").append('<span style="margin-right:10px;">' + files[i].name + '</span>');
                }
            });
        });

        function askReportFault() {
            layer.open({
                title: '提示', content: '是否上报故障？', btn: ['否', '是'],
                yes: function (index) { layer.close(index); },
                btn2: function () {
                    var url = ctx + 'fire/repair/add?linked=true&companyId=' + encodeURIComponent(linkedCompanyId)
                        + '&systemTypeName=' + encodeURIComponent(linkedCategoryName)
                        + '&equipmentName=' + encodeURIComponent(linkedEquipmentName)
                        + '&customerAddress=' + encodeURIComponent(linkedCustomerAddress || '')
                        + '&faultDescription=' + encodeURIComponent(linkedEquipmentName + '巡检测试异常');
                    top.$.modal.open('添加故障报修', url, 900, 700);
                }
            });
        }

        function submitHandler() {
            if (!$("#floor").val()) {
                $.modal.msgError("请选择所在楼层");
                return;
            }
            if (!$("#inspectionTime").val()) {
                $.modal.msgError("请选择巡检时间");
                return;
            }
            if (!$.validate.form()) {
                return;
            }
            var fileInput = document.getElementById('simpleUpload');
            var files = fileInput.files;
            if (files && files.length > 0) {
                var formData = new FormData();
                for (var i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                $.ajax({
                    url: ctx + 'common/uploads',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        if (response.code == 200 || response.code == 0) {
                            $('#imageUrls').val(response.urls);
                            doSubmit();
                        } else {
                            $.modal.msgError('图片上传失败：' + response.msg);
                        }
                    },
                    error: function (xhr, status, error) {
                        $.modal.msgError('图片上传失败：' + error);
                    }
                });
            } else {
                doSubmit();
            }
        }

        function doSubmit() {
            $.operate.save(prefix + "/add", $('#form-inspection-add').serialize());
        }
    </script>
</body>
</html>
