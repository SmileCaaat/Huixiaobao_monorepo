<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改巡查测试')" />
    <link th:href="@{/ruoyi/css/fire-inspection-pickers.css}" rel="stylesheet" charset="utf-8"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-inspection-edit" th:object="${inspection}">
            <input type="hidden" name="inspectionId" th:field="*{inspectionId}" />
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">单位名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="companyId" name="companyId" th:field="*{companyId}" required>
                        <option value="">请选择</option>
                        <option th:each="company : ${companies}" th:value="${company.companyId}"
                            th:text="${company.companyName}" th:data-name="${company.companyName}"
                            th:data-standard="${company.maintenanceStandard}"></option>
                    </select>
                    <input type="hidden" id="companyName" name="companyName" th:field="*{companyName}" />
                    <input type="hidden" id="maintenanceStandard" name="maintenanceStandard" th:field="*{maintenanceStandard}" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">维保类型：</label>
                <div class="col-sm-8">
                    <div class="radio-box" th:each="dict : ${@dict.getType('fire_inspection_type')}">
                        <input type="radio" name="inspectionType" th:value="${dict.dictValue}"
                            th:id="${'inspectionType_'+dict.dictValue}"
                            th:checked="${inspection.inspectionType == dict.dictValue}">
                        <label th:for="${'inspectionType_'+dict.dictValue}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">建筑名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="buildingId" name="buildingId" required>
                        <option value="">请选择</option>
                    </select>
                    <input type="hidden" id="buildingName" name="buildingName" th:field="*{buildingName}" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">所在楼层：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control insp-picker-trigger" id="floorDisplay" placeholder="请选择" readonly>
                    <input type="hidden" id="floor" name="floor" th:value="${inspection.floor}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">系统名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="categoryKey" name="categoryKey" th:field="*{categoryKey}" required>
                        <option value="">请选择</option>
                        <option th:each="type : ${systemTypes}" th:value="${type.categoryKey}"
                            th:data-name="${type.categoryName}" th:text="${type.categoryName}"></option>
                    </select>
                    <input type="hidden" id="systemType" name="systemType" th:field="*{systemType}" />
                    <input type="hidden" id="systemName" name="systemName" th:field="*{systemName}" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">设备名称：</label>
                <div class="col-sm-8">
                    <select class="form-control" id="equipmentKey" name="equipmentKey" required>
                        <option value="">请选择</option>
                        <option th:each="type : ${equipmentTypes}" th:value="${type.equipmentKey}"
                            th:data-name="${type.equipmentName}" th:text="${type.equipmentName}"
                            th:selected="${inspection.equipmentKey == type.equipmentKey}"></option>
                    </select>
                    <input type="hidden" id="equipmentName" name="equipmentName" th:field="*{equipmentName}" />
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">设备数量：</label>
                <div class="col-sm-8">
                    <input type="number" name="equipmentCount" th:field="*{equipmentCount}" class="form-control" min="1" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">具体位置：</label>
                <div class="col-sm-8">
                    <input type="text" name="location" th:field="*{location}" class="form-control" maxlength="200" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">巡检时间：</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control insp-picker-trigger" id="inspectionDateDisplay" placeholder="请选择" readonly>
                    <input type="hidden" name="inspectionTime" id="inspectionTime"
                        th:value="${#dates.format(inspection.inspectionTime, 'yyyy-MM-dd HH:mm:ss')}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">设备状态：</label>
                <div class="col-sm-8">
                    <div class="onoffswitch">
                        <input type="checkbox" class="onoffswitch-checkbox" id="equipmentStatusSwitch"
                            th:checked="${inspection.equipmentStatus == '0'}">
                        <label class="onoffswitch-label" for="equipmentStatusSwitch">
                            <span class="onoffswitch-inner"></span>
                            <span class="onoffswitch-switch"></span>
                        </label>
                    </div>
                    <input type="hidden" name="equipmentStatus" id="equipmentStatus" th:field="*{equipmentStatus}">
                    <span id="statusText" style="margin-left: 10px;"
                        th:style="${inspection.equipmentStatus == '0'} ? 'color: green;' : 'color: red;'"
                        th:text="${inspection.equipmentStatus == '0'} ? '正常' : '异常'">正常</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">详细备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" th:field="*{remark}" class="form-control" rows="3" maxlength="300"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">现场图片：</label>
                <div class="col-sm-8">
                    <input type="hidden" name="imageUrls" id="imageUrls" th:value="${inspection.imageUrls}">
                    <input type="file" id="simpleUpload" multiple accept="image/*" class="form-control">
                    <small class="help-block">支持jpg、jpeg、png、gif格式，最多上传5张图片</small>
                    <div id="existingImages" style="margin-top:10px;"></div>
                    <div id="preview" style="margin-top:10px;"></div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:src="@{/ruoyi/js/fire-inspection-pickers.js}" charset="utf-8"></script>
    <script th:inline="javascript">
        var prefix = ctx + "fire/inspection";
        var currentBuildingId = /*[[${inspection.buildingId}]]*/ null;
        var existingImageUrls = /*[[${inspection.imageUrls}]]*/ '';
        var uploadedImages = [];

        function loadBuildings(companyId, selectedId) {
            $("#buildingId").html('<option value="">请选择</option>');
            if (!companyId) return;
            $.get(prefix + "/buildings/" + companyId, function (res) {
                if (res.code == 0 || res.code == 200) {
                    var list = res.data || [];
                    var html = '<option value="">请选择</option>';
                    for (var i = 0; i < list.length; i++) {
                        var selected = selectedId && selectedId == list[i].buildingId ? ' selected' : '';
                        html += '<option value="' + list[i].buildingId + '" data-name="' + list[i].buildingName + '"' + selected + '>' + list[i].buildingName + '</option>';
                    }
                    $("#buildingId").html(html);
                    $("#buildingName").val($("#buildingId option:selected").data("name") || '');
                }
            });
        }

        function loadEquipmentTypes(categoryKey, selectedKey) {
            $("#equipmentKey").html('<option value="">请选择</option>');
            $("#equipmentName").val('');
            if (!categoryKey) {
                $("#equipmentKey").html('<option value="">请先选择系统名称</option>');
                return;
            }
            $.get(prefix + "/equipmentTypes", { categoryKey: categoryKey }, function (res) {
                if (res.code == 0 || res.code == 200) {
                    var list = res.data || [];
                    var html = '<option value="">请选择</option>';
                    for (var i = 0; i < list.length; i++) {
                        var selected = selectedKey && selectedKey == list[i].equipmentKey ? ' selected' : '';
                        html += '<option value="' + list[i].equipmentKey + '" data-name="' + list[i].equipmentName + '"' + selected + '>' + list[i].equipmentName + '</option>';
                    }
                    $("#equipmentKey").html(html);
                    $("#equipmentName").val($("#equipmentKey option:selected").data("name") || '');
                }
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderExistingImages();
            $('#imageUrls').val(uploadedImages.join(','));
        }

        function renderExistingImages() {
            var html = '<div><strong>已上传的图片：</strong></div>';
            for (var i = 0; i < uploadedImages.length; i++) {
                html += '<div style="display:inline-block;margin:5px;padding:5px;border:1px solid #ddd;border-radius:3px;">';
                html += '<img src="' + uploadedImages[i] + '" style="max-width:80px;max-height:80px;vertical-align:middle;margin-right:6px;" />';
                html += '<button type="button" class="btn btn-xs btn-danger" onclick="removeImage(' + i + ')">删除</button>';
                html += '</div>';
            }
            $('#existingImages').html(html);
        }

        $(function () {
            FireInspectionPickers.initFloorPicker({
                trigger: '#floorDisplay',
                hidden: '#floor',
                mount: $('body')
            });
            FireInspectionPickers.initDatePicker({
                trigger: '#inspectionDateDisplay',
                hidden: '#inspectionTime',
                mount: $('body'),
                defaultNow: false
            });

            loadBuildings($("#companyId").val(), currentBuildingId);

            if (existingImageUrls && existingImageUrls.trim() !== '') {
                uploadedImages = existingImageUrls.split(',').map(function (url) {
                    return url.trim();
                }).filter(function (url) {
                    return url !== '';
                });
                renderExistingImages();
                $('#imageUrls').val(uploadedImages.join(','));
            }

            $("#companyId").change(function () {
                var opt = $(this).find("option:selected");
                $("#companyName").val(opt.data("name") || '');
                $("#maintenanceStandard").val(opt.data("standard") || '');
                loadBuildings($(this).val());
            });

            $("#buildingId").change(function () {
                $("#buildingName").val($(this).find("option:selected").data("name") || '');
            });

            $("#categoryKey").change(function () {
                var opt = $(this).find("option:selected");
                var key = $(this).val() || '';
                $("#systemName").val(opt.data("name") || '');
                $("#systemType").val(key);
                $("#equipmentKey").val('');
                $("#equipmentName").val('');
                loadEquipmentTypes(key);
            });

            $("#equipmentKey").change(function () {
                $("#equipmentName").val($(this).find("option:selected").data("name") || '');
            });

            $("#equipmentStatusSwitch").change(function () {
                if ($(this).is(":checked")) {
                    $("#equipmentStatus").val("0");
                    $("#statusText").text("正常").css("color", "green");
                } else {
                    $("#equipmentStatus").val("1");
                    $("#statusText").text("异常").css("color", "red");
                }
            });

            $("#simpleUpload").change(function () {
                var files = this.files;
                $("#preview").html('');
                for (var i = 0; i < files.length; i++) {
                    $("#preview").append('<span style="margin-right:10px;">' + files[i].name + '</span>');
                }
            });
        });

        function submitHandler() {
            if (!$("#floor").val()) {
                $.modal.msgError("请选择所在楼层");
                return;
            }
            if (!$("#inspectionTime").val()) {
                $.modal.msgError("请选择巡检时间");
                return;
            }
            if (!$.validate.form()) {
                return;
            }
            var fileInput = document.getElementById('simpleUpload');
            var files = fileInput.files;
            if (files && files.length > 0) {
                var formData = new FormData();
                for (var i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                $.ajax({
                    url: ctx + 'common/uploads',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        if (response.code == 200 || response.code == 0) {
                            var newUrls = (response.urls || '').split(',').filter(Boolean);
                            uploadedImages = uploadedImages.concat(newUrls);
                            $('#imageUrls').val(uploadedImages.join(','));
                            doSubmit();
                        } else {
                            $.modal.msgError('图片上传失败：' + response.msg);
                        }
                    },
                    error: function (xhr, status, error) {
                        $.modal.msgError('图片上传失败：' + error);
                    }
                });
            } else {
                doSubmit();
            }
        }

        function doSubmit() {
            $.operate.save(prefix + "/edit", $('#form-inspection-edit').serialize());
        }
    </script>
</body>
</html>
