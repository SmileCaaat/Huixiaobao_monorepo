<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">

<head>
    <th:block th:include="include :: header('巡查测试')" />
    <style>
        /* 本页搜索栏：单行紧凑布局，查询/重置置前 */
        .fire-search-layout .select-list ul {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 4px 6px;
            overflow-x: auto;
        }

        .fire-search-layout .select-list li {
            float: none;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            margin: 2px 4px 2px 0;
            flex-shrink: 0;
        }

        .fire-search-layout .select-list li.label-actions {
            margin-right: 8px;
        }

        .fire-search-layout .select-list li label:not(.radio-box) {
            float: none;
            width: auto;
            margin: 0 4px 0 0;
            white-space: nowrap;
            text-align: right;
            line-height: 30px;
        }

        .fire-search-layout .select-list li input,
        .fire-search-layout .select-list li select {
            float: none;
            width: 110px;
            vertical-align: middle;
        }

        .fire-search-layout .select-list li input[name="keyword"] {
            width: 150px;
        }

        .fire-search-layout .select-list li input[name="inspectionMonth"] {
            width: 90px;
        }

        .fire-search-layout .select-list li .btn {
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>
</head>

<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse fire-search-layout">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li class="label-actions">
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                        class="fa fa-search"></i>&nbsp;查询</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                        class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                            <li>
                                <label>关键词：</label>
                                <input type="text" name="keyword" placeholder="客户/建筑/设备/位置/操作员" />
                            </li>
                            <li>
                                <label>巡检月份：</label>
                                <input type="text" class="time-input" id="inspectionMonth" name="inspectionMonth" placeholder="YYYY-MM" />
                            </li>
                            <li>
                                <label>类型：</label>
                                <select name="inspectionType" th:with="type=${@dict.getType('fire_inspection_type')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:value="${dict.dictValue}"
                                        th:text="${dict.dictLabel}"></option>
                                </select>
                            </li>
                            <li>
                                <label>维保标准：</label>
                                <input type="text" name="maintenanceStandard" />
                            </li>
                            <li>
                                <label>系统名称：</label>
                                <select name="categoryKey">
                                    <option value="">所有</option>
                                    <option th:each="type : ${systemTypes}" th:value="${type.categoryKey}"
                                        th:text="${type.categoryName}"></option>
                                </select>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="fire:inspection:add">
                    <i class="fa fa-plus"></i> 新增
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
                    shiro:hasPermission="fire:inspection:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="fire:inspection:export">
                    <i class="fa fa-download"></i> 导出数据
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('fire:inspection:edit')}]];
        var removeFlag = [[${@permission.hasPermi('fire:inspection:remove')}]];
        var inspectionTypes = [[${@dict.getType('fire_inspection_type')}]];
        var prefix = ctx + "fire/inspection";

        $(function () {
            $("#inspectionMonth").datetimepicker({
                format: "yyyy-mm",
                startView: 3,
                minView: 3,
                autoclose: true,
                todayBtn: true
            });

            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                detailUrl: prefix + "/detail/{id}",
                modalName: "巡查测试",
                columns: [{
                    checkbox: true
                }, {
                    field: 'inspectionId',
                    title: '序号',
                    formatter: function (value, row, index) {
                        return $.table.serialNumber(index);
                    }
                }, {
                    field: 'companyName',
                    title: '客户名称'
                }, {
                    field: 'floor',
                    title: '所在楼层'
                }, {
                    field: 'equipmentName',
                    title: '巡检设备'
                }, {
                    field: 'location',
                    title: '具体位置'
                }, {
                    field: 'equipmentStatus',
                    title: '巡检结果',
                    align: 'center',
                    formatter: function (value) {
                        if (value === '0') {
                            return '<span class="label label-success">正常</span>';
                        }
                        return '<span class="label label-danger">异常</span>';
                    }
                }, {
                    field: 'equipmentCount',
                    title: '数量',
                    align: 'center'
                }, {
                    field: 'inspectionType',
                    title: '类型',
                    formatter: function (value) {
                        return $.table.selectDictLabel(inspectionTypes, value);
                    }
                }, {
                    field: 'inspectorName',
                    title: '操作员'
                }, {
                    field: 'inspectionTime',
                    title: '巡检时间'
                }, {
                    field: 'createTime',
                    title: '登记日期'
                }, {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row) {
                        var actions = [];
                        actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.inspectionId + '\')"><i class="fa fa-eye"></i>查看</a> ');
                        if (editFlag) {
                            actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.inspectionId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        }
                        if (removeFlag) {
                            actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.inspectionId + '\')"><i class="fa fa-remove"></i>删除</a>');
                        }
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>

</html>
