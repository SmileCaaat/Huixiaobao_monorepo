<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('维保详情内容')" />
    <style>
        .detail-container { padding: 20px; background: #f5f5f5; min-height: 100vh; }
        .item-header { background: linear-gradient(135deg, #1565c0, #42a5f5); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .item-header h3 { margin: 0; display: flex; align-items: center; }
        .item-header h3 i { margin-right: 10px; }
        .btn-toolbar { margin-bottom: 15px; }
        .btn-toolbar .btn { margin-right: 10px; }
        .card-panel { background: white; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); padding: 20px; margin-bottom: 16px; }
        .card-panel h4 { margin: 0 0 16px; font-size: 15px; color: #333; font-weight: 600; }
        .info-row { margin-bottom: 10px; font-size: 13px; color: #666; }
        .info-row .label-text { color: #999; margin-right: 8px; }
        .info-row .value-text { color: #333; }
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .status-pending { background: #e9ecef; color: #6c757d; }
        .status-normal { background: #d4edda; color: #155724; }
        .status-fault { background: #f8d7da; color: #721c24; }
        .status-nodevice { background: #fff3cd; color: #856404; }
        .condition-question { font-size: 18px; color: #333; margin-bottom: 18px; }
        .condition-options { display: flex; align-items: center; gap: 42px; }
        .condition-option { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 400; cursor: pointer; }
        .condition-option input { width: 19px; height: 19px; margin: 0; cursor: pointer; }
        .detail-status-row { display: flex; gap: 18px; flex-wrap: wrap; }
        .detail-status-btn { min-width: 150px; height: 48px; border: 2px solid #d5d9dd; border-radius: 8px; background: #fff; color: #555; font-size: 16px; cursor: pointer; transition: all .15s; }
        .detail-status-btn i { margin-right: 7px; }
        .detail-status-btn.status-normal.active { border-color: #2d8cf0; background: #2d8cf0; color: #fff; }
        .detail-status-btn.status-fault.active { border-color: #dc3545; background: #dc3545; color: #fff; }
        .detail-status-btn.status-nodevice.active { border-color: #f0ad4e; background: #f0ad4e; color: #fff; }
        .handling-panel { display: none; }
        .handling-panel.show { display: block; }
        .handling-row { display: flex; gap: 22px; flex-wrap: wrap; }
        .handling-btn { min-width: 190px; height: 52px; border: 2px solid #d5d9dd; border-radius: 8px; background: #fff; color: #555; font-size: 17px; cursor: pointer; }
        .handling-btn i { margin-right: 8px; }
        .handling-btn.active { border-color: #2d8cf0; background: #2d8cf0; color: #fff; }
        .notes-area textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; }
        .image-preview-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .image-preview-item { position: relative; width: 96px; height: 96px; }
        .image-preview-item img { width: 96px; height: 96px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #eee; }
        .image-preview-item .img-remove { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: #dc3545; color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }
        .upload-row { margin-top: 10px; }
        .save-bar { text-align: right; }
        .save-bar .btn { min-width: 100px; }
    </style>
</head>
<body class="gray-bg">
<div class="detail-container">
    <div class="item-header">
        <h3>
            <i class="fa fa-file-text-o"></i>
            <span>维保详情内容 - </span>
            <span th:text="${item.itemName}">检查项</span>
        </h3>
    </div>

    <div class="card-panel">
        <div class="condition-question"><span th:text="${item.itemName}">检查项</span>是否完好？</div>
        <div class="condition-options">
            <label class="condition-option">
                <input type="radio" name="isGood" value="1" th:checked="${item.checkResult == '1'}"> 是
            </label>
            <label class="condition-option">
                <input type="radio" name="isGood" value="0" th:checked="${item.checkResult == '2' or item.checkResult == '3'}"> 否
            </label>
        </div>
    </div>

    <div class="card-panel">
        <h4>设备状态</h4>
        <div class="detail-status-row" id="deviceStatus">
            <button type="button" class="detail-status-btn status-normal" data-status="1">
                <i class="fa fa-check-square-o"></i>正常
            </button>
            <button type="button" class="detail-status-btn status-fault" data-status="2">
                <i class="fa fa-square-o"></i>故障
            </button>
            <button type="button" class="detail-status-btn status-nodevice" data-status="3">
                <i class="fa fa-square-o"></i>无此设备
            </button>
        </div>
    </div>

    <div class="card-panel handling-panel" id="handlingPanel">
        <h4>处理措施</h4>
        <div class="handling-row" id="handlingMeasures">
            <button type="button" class="handling-btn" data-measure="现场解决">
                <i class="fa fa-square-o"></i>现场解决
            </button>
            <button type="button" class="handling-btn" data-measure="故障报修">
                <i class="fa fa-square-o"></i>故障报修
            </button>
        </div>
    </div>
    <div class="btn-toolbar">
        <a class="btn btn-default" href="javascript:void(0)" id="btnBack"><i class="fa fa-arrow-left"></i> 返回</a>
    </div>

    <div class="card-panel notes-area">
        <h4>其他说明</h4>
        <textarea id="otherNotes" placeholder="请输入其他说明..." th:text="${item.otherNotes}"></textarea>
    </div>

    <div class="card-panel">
        <h4>附件 / 现场图片</h4>
        <div class="upload-row">
            <input type="file" id="fileUpload" multiple accept="image/*">
        </div>
        <div id="imagePreview" class="image-preview-list"></div>
    </div>

    <div class="card-panel save-bar">
        <button type="button" class="btn btn-primary" id="btnSave"><i class="fa fa-save"></i> 保存</button>
    </div>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
    var prefix = ctx + "fire/task";
    var taskId = [[${task.taskId}]];
    var recordId = [[${item.recordId}]];
    var categoryKey = /*[[${categoryKey}]]*/ '';
    var equipmentKey = /*[[${equipmentKey}]]*/ '';
    var initialImages = /*[[${item.faultImages}]]*/ '';
    var selectedCheckResult = /*[[${item.checkResult}]]*/ '0';
    var selectedHandlingMeasure = /*[[${item.repairSuggestion}]]*/ '';
    var repairCompanyId = /*[[${repairCompanyId}]]*/ null;
    var repairCompanyName = /*[[${repairCompanyName}]]*/ '';
    var repairSystemTypeName = /*[[${repairSystemTypeName}]]*/ '';
    var repairEquipmentName = /*[[${repairEquipmentName}]]*/ '';
    var repairCustomerAddress = /*[[${repairCustomerAddress}]]*/ '';
    var repairItemName = /*[[${item.itemName}]]*/ '';
    var pendingFaultImages = [];
    var detailSaving = false;

    function setDetailStatus(status) {
        selectedCheckResult = String(status || '0');
        $('.detail-status-btn').removeClass('active').find('i').removeClass('fa-check-square-o').addClass('fa-square-o');
        var $active = $('.detail-status-btn[data-status="' + selectedCheckResult + '"]');
        $active.addClass('active').find('i').removeClass('fa-square-o').addClass('fa-check-square-o');
        if (selectedCheckResult === '1') {
            $('input[name="isGood"][value="1"]').prop('checked', true);
        } else if (selectedCheckResult === '2' || selectedCheckResult === '3') {
            $('input[name="isGood"][value="0"]').prop('checked', true);
        }
        if (selectedCheckResult === '2') {
            $('#handlingPanel').addClass('show');
        } else {
            $('#handlingPanel').removeClass('show');
            selectedHandlingMeasure = '';
        }
        renderHandlingMeasure();
        var labels = { '0': '未检查', '1': '正常', '2': '故障', '3': '无此设备' };
        $('.status-pill').removeClass('status-pending status-normal status-fault status-nodevice')
            .addClass(selectedCheckResult === '1' ? 'status-normal' : (selectedCheckResult === '2' ? 'status-fault' : (selectedCheckResult === '3' ? 'status-nodevice' : 'status-pending')))
            .text(labels[selectedCheckResult] || labels['0']);
    }

    function renderHandlingMeasure() {
        $('.handling-btn').removeClass('active').find('i').removeClass('fa-check-square-o').addClass('fa-square-o');
        if (!selectedHandlingMeasure) {
            return;
        }
        var $active = $('.handling-btn[data-measure="' + selectedHandlingMeasure + '"]');
        $active.addClass('active').find('i').removeClass('fa-square-o').addClass('fa-check-square-o');
    }

    function openLinkedRepair() {
        var notes = $('#otherNotes').val() || '';
        var description = repairItemName + '：' + (notes || '检查发现故障');
        var query = $.param({
            linked: true,
            companyId: repairCompanyId,
            companyName: repairCompanyName,
            systemTypeName: repairSystemTypeName,
            equipmentName: repairEquipmentName,
            customerAddress: repairCustomerAddress,
            faultDescription: description
        });
        var url = ctx + 'fire/repair/add?' + query;
        top.$.modal.open('新增故障报修', url, 900, 650);
    }

    function confirmFaultReport() {
        top.layer.open({
            type: 0,
            title: '提示',
            content: '<div style="font-size:18px;text-align:center;padding:12px 8px;">是否上报故障？</div>',
            btn: ['否', '是'],
            yes: function (index) {
                top.layer.close(index);
            },
            btn2: function (index) {
                top.layer.close(index);
                $.ajax({
                    url: prefix + '/updateCheckDetail',
                    type: 'post',
                    data: {
                        recordId: recordId,
                        checkResult: '2',
                        repairSuggestion: '故障报修'
                    },
                    complete: function () {
                        openLinkedRepair();
                    }
                });
                return false;
            }
        });
    }

    function goBack() {
        window.location.href = prefix + "/inspectionTestEquipment/" + taskId + "/"
            + encodeURIComponent(categoryKey) + "/" + encodeURIComponent(equipmentKey);
    }

    function escapeHtml(value) {
        return $('<div>').text(value == null ? '' : String(value)).html();
    }

    function initPendingImages() {
        pendingFaultImages = initialImages ? String(initialImages).split(',').map(function (s) {
            return $.trim(s);
        }).filter(function (s) { return !!s; }) : [];
        renderImagePreview();
    }

    function renderImagePreview() {
        var html = '';
        pendingFaultImages.forEach(function (img, idx) {
            if (!img) return;
            html += '<div class="image-preview-item" data-index="' + idx + '">'
                + '<img class="js-preview-image" src="' + escapeHtml(img) + '" data-url="' + escapeHtml(img) + '" alt="">'
                + '<span class="img-remove js-remove-image" title="移除" data-index="' + idx + '">×</span>'
                + '</div>';
        });
        $('#imagePreview').html(html);
    }

    function saveOtherNotes() {
        if (detailSaving) {
            return;
        }
        var otherNotes = $('#otherNotes').val();
        if (otherNotes == null) {
            otherNotes = '';
        }
        if (selectedCheckResult === '0' || !selectedCheckResult) {
            $.modal.alertWarning('请选择设备状态');
            return;
        }
        if (selectedCheckResult === '2' && !selectedHandlingMeasure) {
            $.modal.alertWarning('请选择处理措施');
            return;
        }
        var fileInput = document.getElementById('fileUpload');
        detailSaving = true;
        var $btn = $('#btnSave');
        $btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> 保存中...');

        function finishUnlock() {
            detailSaving = false;
            $btn.prop('disabled', false).html('<i class="fa fa-save"></i> 保存');
        }

        function submit(imageUrls) {
            $.ajax({
                url: prefix + "/updateCheckDetail",
                type: "post",
                data: {
                    recordId: recordId,
                    checkResult: selectedCheckResult,
                    repairSuggestion: selectedHandlingMeasure,
                    otherNotes: otherNotes,
                    faultImages: imageUrls == null ? '' : imageUrls
                },
                success: function (res) {
                    finishUnlock();
                    if (res.code == 0) {
                        $.modal.msgSuccess("保存成功");
                        initialImages = imageUrls || '';
                        pendingFaultImages = initialImages ? String(initialImages).split(',').filter(function (s) { return !!s; }) : [];
                        if (fileInput) {
                            fileInput.value = '';
                        }
                        renderImagePreview();
                    } else {
                        $.modal.alertError(res.msg || "保存失败");
                    }
                },
                error: function (xhr) {
                    finishUnlock();
                    $.modal.alertError((xhr.responseJSON && xhr.responseJSON.msg) || "保存失败");
                }
            });
        }

        if (fileInput && fileInput.files.length > 0) {
            var formData = new FormData();
            for (var i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }
            $.ajax({
                url: ctx + 'common/uploads',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function (result) {
                    if (result.code == 0) {
                        var uploaded = result.urls ? String(result.urls).split(',').filter(function (s) { return !!s; }) : [];
                        var merged = pendingFaultImages.concat(uploaded);
                        submit(merged.join(','));
                    } else {
                        finishUnlock();
                        $.modal.alertError("文件上传失败：" + (result.msg || ''));
                    }
                },
                error: function (xhr, status, error) {
                    finishUnlock();
                    $.modal.alertError("文件上传失败：" + error);
                }
            });
        } else {
            submit(pendingFaultImages.join(','));
        }
    }

    $('#btnBack').on('click', function (e) {
        e.preventDefault();
        goBack();
    });
    $('#btnSave').on('click', function (e) {
        e.preventDefault();
        saveOtherNotes();
    });
    $('#deviceStatus').on('click', '.detail-status-btn', function (e) {
        e.preventDefault();
        setDetailStatus($(this).attr('data-status'));
    });
    $('#handlingMeasures').on('click', '.handling-btn', function (e) {
        e.preventDefault();
        selectedHandlingMeasure = $(this).attr('data-measure') || '';
        renderHandlingMeasure();
        if (selectedHandlingMeasure === '故障报修') {
            confirmFaultReport();
        }
    });
    $('input[name="isGood"]').on('change', function () {
        if ($(this).val() === '1') {
            setDetailStatus('1');
        } else if (selectedCheckResult === '0' || selectedCheckResult === '1') {
            setDetailStatus('2');
        }
    });
    $('#imagePreview').on('click', '.js-preview-image', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var url = $(this).attr('data-url');
        if (url) {
            $.modal.image(url);
        }
    });
    $('#imagePreview').on('click', '.js-remove-image', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var idx = parseInt($(this).attr('data-index'), 10);
        if (!isNaN(idx)) {
            pendingFaultImages.splice(idx, 1);
            renderImagePreview();
        }
    });

    setDetailStatus(selectedCheckResult);
    initPendingImages();
</script>
</body>
</html>
