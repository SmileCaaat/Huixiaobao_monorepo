<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('故障报修列表')" />
    <style>
        /* 独立工单分类卡片：与搜索区、列表区同宽对齐，不放入搜索表单 */
        .repair-category-card {
            width: 100%;
            background: #fff;
            border-radius: 6px;
            margin-top: 10px;
            padding: 10px 15px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, .2);
            box-sizing: border-box;
        }
        .repair-workbench-tabs {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            width: 100%;
            margin: 0;
            padding: 0;
            border: none;
            box-sizing: border-box;
        }
        .repair-workbench-label {
            font-size: 13px;
            color: #333;
            font-weight: 500;
            margin-right: 8px;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        .repair-workbench-buttons {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            flex: 0 0 auto;
        }
        .repair-workbench-tabs .btn {
            margin-right: 6px;
            margin-bottom: 0;
            white-space: nowrap;
        }
        .repair-workbench-tabs .btn.active {
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
        }

        /* 本页搜索栏局部布局：不改全局字体与公共 select-list */
        .fire-search-layout .select-list ul {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
        }

        .fire-search-layout .select-list li {
            float: none;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            margin: 4px 8px 4px 0;
        }

        .fire-search-layout .select-list li label:not(.radio-box) {
            float: none;
            width: auto;
            margin: 0 6px 0 0;
            white-space: nowrap;
            text-align: right;
            line-height: 30px;
        }

        .fire-search-layout .select-list li input,
        .fire-search-layout .select-list li select {
            float: none;
            width: 150px;
            vertical-align: middle;
        }

        .fire-search-layout .select-list .select-time label,
        .fire-search-layout .select-list .select-time span,
        .fire-search-layout .select-list .select-time input {
            float: none;
        }

        .fire-search-layout .select-list .select-time input {
            width: 110px;
        }

        .fire-search-layout .select-list .select-time span {
            display: inline-block;
            margin: 0 4px;
            line-height: 30px;
        }

        .fire-search-layout .select-list .select-time label {
            margin-top: 0;
        }

        .fire-search-layout .select-list li .btn {
            vertical-align: middle;
        }
    </style>
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse fire-search-layout">
                <form id="formId">
                    <input type="hidden" name="params[workbenchCategory]" id="workbenchCategory" th:value="${defaultWorkbenchCategory}"/>
                    <input type="hidden" name="params[listCategory]" id="listCategory" th:value="${defaultListCategory}"/>
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>报修单号：</label>
                                <input type="text" name="repairNo" placeholder="请输入报修单号"/>
                            </li>
                            <li>
                                <label>单位名称：</label>
                                <input type="text" name="companyName" placeholder="请输入单位名称"/>
                            </li>
                            <li>
                                <label>紧急程度：</label>
                                <select name="urgencyLevel">
                                    <option value="">全部</option>
                                    <option th:each="level : ${urgencyLevels}" th:value="${level.code}" th:text="${level.info}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>发现时间：</label>
                                <input type="text" class="time-input" id="startTime" placeholder="开始时间" name="params[beginFoundTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="结束时间" name="params[endFoundTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="resetSearch()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <!-- 工单分类：待处理 / 已完成（与小程序一致；员工工作台额外保留「我上报的」） -->
            <div class="col-sm-12 repair-category-card">
                <div class="repair-workbench-tabs">
                    <span class="repair-workbench-label">工单分类：</span>
                    <div class="repair-workbench-buttons" th:unless="${workbenchMode}">
                        <a href="javascript:void(0)" class="btn btn-sm btn-primary active" data-category="pending" onclick="switchListCategory('pending', this)">待处理</a>
                        <a href="javascript:void(0)" class="btn btn-sm btn-default" data-category="completed" onclick="switchListCategory('completed', this)">已完成</a>
                    </div>
                    <div class="repair-workbench-buttons" th:if="${workbenchMode}">
                        <a href="javascript:void(0)" class="btn btn-sm btn-primary active" data-category="assignedPending" onclick="switchWorkbench('assignedPending', this)">待处理</a>
                        <a href="javascript:void(0)" class="btn btn-sm btn-default" data-category="completed" onclick="switchWorkbench('completed', this)">已完成</a>
                        <a href="javascript:void(0)" class="btn btn-sm btn-default" data-category="reported" onclick="switchWorkbench('reported', this)">我上报的</a>
                    </div>
                </div>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group" th:unless="${workbenchMode}">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="fire:repair:add">
                    <i class="fa fa-plus"></i> 新增
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="fire:repair:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="fire:repair:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="fire:repair:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('fire:repair:edit')}]];
        var removeFlag = [[${@permission.hasPermi('fire:repair:remove')}]];
        var dispatchFlag = [[${@permission.hasPermi('fire:repair:accept')}]];
        var startFlag = [[${@permission.hasPermi('fire:repair:start')}]];
        var completeFlag = [[${@permission.hasPermi('fire:repair:complete')}]];
        var currentUserId = [[${currentUserId}]];
        var workbenchMode = [[${workbenchMode}]];
        var prefix = ctx + "fire/repair";
        var startingRepairId = null;

        $(function() {
            var columns = [];
            if (!workbenchMode) {
                columns.push({ checkbox: true });
            }
            columns = columns.concat([{
                    field: 'repairId',
                    title: '报修ID',
                    visible: false
                },
                {
                    field: 'repairNo',
                    title: '报修单号',
                    formatter: function(value, row) {
                        return '<a href="javascript:void(0)" onclick="$.operate.detail(' + row.repairId + ')">' + value + '</a>';
                    }
                },
                {
                    field: 'companyName',
                    title: '单位名称'
                },
                {
                    field: 'systemTypeName',
                    title: '系统名称'
                },
                {
                    field: 'equipmentName',
                    title: '设备名称'
                },
                {
                    field: 'urgencyLevel',
                    title: '紧急程度',
                    formatter: function(value) {
                        if (value == '0') return '<span class="badge badge-secondary">一般</span>';
                        if (value == '1') return '<span class="badge badge-warning">紧急</span>';
                        if (value == '2') return '<span class="badge badge-danger">特急</span>';
                        if (value == null || value === '') return '';
                        return '<span class="badge badge-default">未知</span>';
                    }
                },
                {
                    field: 'repairStatus',
                    title: '维修状态',
                    formatter: function(value) {
                        if (value == '0') return '<span class="badge badge-info">待处理</span>';
                        if (value == '1') return '<span class="badge badge-warning">处理中</span>';
                        if (value == '2') return '<span class="badge badge-success">已完成</span>';
                        return value;
                    }
                },
                {
                    field: 'reporterName',
                    title: '报修人'
                },
                {
                    field: 'repairPerson',
                    title: '处理人',
                    formatter: function(value, row) {
                        return row.repairUserName || value || '';
                    }
                },
                {
                    field: 'dispatchTime',
                    title: '派发时间'
                },
                {
                    field: 'foundTime',
                    title: '发现时间'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row) {
                        var actions = [];
                        var completed = isCompletedRepair(row);

                        // 查看：所有状态都可看
                        actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="handleRepair(' + row.repairId + ')"><i class="fa fa-eye"></i>查看</a> ');

                        // 已完成：只读，不展示派发 / 维修处理 / 编辑 / 删除 / 撤回
                        if (completed) {
                            return actions.join('');
                        }

                        if (!workbenchMode) {
                            // 待派发（待处理）可编辑删除
                            if (row.repairStatus == '0') {
                                actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.repairId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.repairId + '\')"><i class="fa fa-remove"></i>删除</a> ');
                            }
                            // 未完成才可派发
                            actions.push('<a class="btn btn-primary btn-xs ' + dispatchFlag + '" href="javascript:void(0)" onclick="dispatchRepair(' + row.repairId + ')"><i class="fa fa-share"></i>派发</a> ');
                            if (canRecallRepair(row)) {
                                actions.push('<a class="btn btn-warning btn-xs ' + dispatchFlag + '" href="javascript:void(0)" onclick="recallRepair(' + row.repairId + ')"><i class="fa fa-undo"></i>撤回</a> ');
                            }
                        }

                        // 维修处理：仅未完成且当前用户可处理时
                        if (canHandleRepair(row)) {
                            actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="handleRepair(' + row.repairId + ')"><i class="fa fa-wrench"></i>维修处理</a> ');
                        }

                        return actions.join('');
                    }
                }]);

            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "故障报修",
                columns: columns
            };
            $.table.init(options);
        });

        function switchListCategory(category, el) {
            $('#listCategory').val(category || 'pending');
            $('.repair-workbench-tabs .btn').removeClass('btn-primary active').addClass('btn-default');
            $(el).removeClass('btn-default').addClass('btn-primary active');
            $.table.search();
        }

        function switchWorkbench(category, el) {
            $('#workbenchCategory').val(category);
            $('#listCategory').val(category === 'completed' ? 'completed' : 'pending');
            $('.repair-workbench-tabs .btn').removeClass('btn-primary active').addClass('btn-default');
            $(el).removeClass('btn-default').addClass('btn-primary active');
            $.table.search();
        }

        function resetSearch() {
            var listCat = $('#listCategory').val() || (workbenchMode ? 'assignedPending' : 'pending');
            var workCat = $('#workbenchCategory').val() || (workbenchMode ? 'assignedPending' : '');
            $.form.reset();
            $('#listCategory').val(workbenchMode ? (workCat === 'completed' ? 'completed' : 'pending') : listCat);
            $('#workbenchCategory').val(workCat);
            $.table.search();
        }

        function sameUser(a, b) {
            if (a == null || b == null || a === '' || b === '') {
                return false;
            }
            return String(a) === String(b);
        }

        function isCompletedRepair(row) {
            return !!(row && String(row.repairStatus) === '2');
        }

        function canHandleRepair(row) {
            if (!row || isCompletedRepair(row)) {
                return false;
            }
            if (sameUser(row.repairUserId, currentUserId) && row.repairStatus == '1') {
                return true;
            }
            // 待处理且未派发：上报人可进入维修接单
            return sameUser(row.reporterId, currentUserId)
                && row.repairStatus == '0'
                && (row.repairUserId == null || row.repairUserId === '');
        }

        function canStartRepair(row) {
            return sameUser(row.repairUserId, currentUserId)
                && row.repairStatus == '1'
                && !row.startTime;
        }

        function canCompleteRepair(row) {
            return sameUser(row.repairUserId, currentUserId)
                && row.repairStatus == '1'
                && !!row.startTime;
        }

        /** 是否可撤回：已派发 + 有处理人 + 未开始 + 未完成 */
        function canRecallRepair(row) {
            if (!row || isCompletedRepair(row)) {
                return false;
            }
            if (row.repairStatus != '1') {
                return false;
            }
            if (row.repairUserId == null || row.repairUserId === '') {
                return false;
            }
            if (row.startTime) {
                return false;
            }
            if (row.repairDescription) {
                return false;
            }
            if (row.repairImages) {
                return false;
            }
            if (row.completeTime) {
                return false;
            }
            return true;
        }

        $.operate.detail = function(repairId) {
            handleRepair(repairId);
        }

        function handleRepair(repairId) {
            var url = prefix + '/handle/' + repairId;
            $.modal.openTab("故障维修", url);
        }

        function dispatchRepair(repairId) {
            var url = prefix + '/dispatch/' + repairId;
            $.modal.open("派发报修", url, '700', '420');
        }

        function startRepair(repairId) {
            $.modal.confirm("确认开始处理该报修工单？", function() {
                if (startingRepairId === repairId) {
                    return;
                }
                startingRepairId = repairId;
                $.ajax({
                    url: prefix + '/start/' + repairId,
                    type: 'post',
                    dataType: 'json',
                    success: function(result) {
                        startingRepairId = null;
                        if (result.code == web_status.SUCCESS) {
                            $.modal.msgSuccess(result.msg || '已开始处理');
                            $.table.refresh();
                        } else {
                            $.modal.alertError(result.msg || '开始处理失败');
                        }
                    },
                    error: function(xhr) {
                        startingRepairId = null;
                        var msg = (xhr.responseJSON && xhr.responseJSON.msg) || '开始处理失败，请稍后重试';
                        $.modal.alertError(msg);
                    }
                });
            });
        }

        function recallRepair(repairId) {
            top.layer.open({
                type: 0,
                icon: 3,
                title: '撤回',
                content: '确定要撤回该故障报修工单吗？撤回后，原处理人将无法继续处理该工单。',
                btn: ['取消', '确定撤回'],
                yes: function (index) {
                    top.layer.close(index);
                },
                btn2: function (index) {
                    var $btn = top.$('#layui-layer' + index).find('.layui-layer-btn1');
                    if ($btn.hasClass('layer-disabled')) {
                        return false;
                    }
                    $btn.addClass('layer-disabled').text('撤回中');
                    $.ajax({
                        url: prefix + '/recall',
                        type: 'post',
                        dataType: 'json',
                        data: { repairId: repairId },
                        success: function (result) {
                            if (result.code == web_status.SUCCESS) {
                                top.layer.close(index);
                                $.modal.msgSuccess(result.msg || '撤回成功');
                                $.table.refresh();
                            } else {
                                $btn.removeClass('layer-disabled').text('确定撤回');
                                $.modal.alertError(result.msg || '撤回失败');
                            }
                        },
                        error: function () {
                            $btn.removeClass('layer-disabled').text('确定撤回');
                            $.modal.alertError('撤回失败，请稍后重试');
                        }
                    });
                    return false;
                }
            });
        }

        function completeRepair(repairId) {
            var url = prefix + '/complete/' + repairId;
            $.modal.open("填写处理结果", url, '800', '600');
        }
    </script>
</body>
</html>
