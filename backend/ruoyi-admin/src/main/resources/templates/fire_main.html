<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防设备管理系统 - 首页</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet" />
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet" />
    <style>
        :root {
            --fire-red: #dc3545;
            --fire-gradient: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
        }

        body.fire-theme {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }

        .fire-dashboard {
            padding: 20px;
        }

        .fire-header {
            background: var(--fire-gradient);
            border-radius: 15px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(220, 53, 69, 0.3);
        }

        .fire-header h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .fire-header .header-info {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-top: 8px;
        }

        .fire-header .header-icon {
            font-size: 50px;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 5px solid;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-card.card-primary {
            border-left-color: #007bff;
        }

        .stat-card.card-success {
            border-left-color: #28a745;
        }

        .stat-card.card-warning {
            border-left-color: #ffc107;
        }

        .stat-card.card-danger {
            border-left-color: #dc3545;
        }

        .stat-card .stat-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 60px;
            opacity: 0.15;
        }

        .stat-card.card-primary .stat-icon {
            color: #007bff;
        }

        .stat-card.card-success .stat-icon {
            color: #28a745;
        }

        .stat-card.card-warning .stat-icon {
            color: #ffc107;
        }

        .stat-card.card-danger .stat-icon {
            color: #dc3545;
        }

        .stat-card .stat-number {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
        }

        .stat-card.card-primary .stat-number {
            color: #007bff;
        }

        .stat-card.card-success .stat-number {
            color: #28a745;
        }

        .stat-card.card-warning .stat-number {
            color: #ffc107;
        }

        .stat-card.card-danger .stat-number {
            color: #dc3545;
        }

        .stat-card .stat-title {
            font-size: 14px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .info-panel .panel-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .info-panel .panel-header i {
            font-size: 24px;
            margin-right: 12px;
            color: var(--fire-red);
        }

        .info-panel .panel-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .status-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .status-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .status-item .status-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 22px;
            color: white;
        }

        .status-item .status-icon.bg-success {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .status-item .status-icon.bg-warning {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
        }

        .status-item .status-icon.bg-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }

        .status-item .status-info h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .status-item .status-info p {
            margin: 0;
            font-size: 13px;
            color: #6c757d;
        }

        .status-item .status-count {
            margin-left: auto;
            font-size: 24px;
            font-weight: 700;
        }

        .status-item .status-count.text-success {
            color: #28a745;
        }

        .status-item .status-count.text-warning {
            color: #ffc107;
        }

        .status-item .status-count.text-danger {
            color: #dc3545;
        }

        .quick-entry {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
            background: #f8f9fa;
            border-radius: 15px;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .quick-entry:hover {
            background: var(--fire-gradient);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(220, 53, 69, 0.3);
            text-decoration: none;
        }

        .quick-entry:hover i,
        .quick-entry:hover span {
            color: white;
        }

        .quick-entry i {
            font-size: 36px;
            color: var(--fire-red);
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .quick-entry span {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            transition: all 0.3s ease;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            border-left: 4px solid var(--fire-red);
        }

        .alert-item.warning-type {
            background: linear-gradient(135deg, #fffdf5 0%, #fff3cd 100%);
            border-left-color: #ffc107;
        }

        .alert-item.info-type {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-left-color: #17a2b8;
        }

        .alert-item .alert-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fire-red);
            color: white;
            margin-right: 12px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .alert-item.warning-type .alert-icon {
            background: #ffc107;
        }

        .alert-item.info-type .alert-icon {
            background: #17a2b8;
        }

        .alert-item .alert-content h5 {
            margin: 0 0 3px 0;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .alert-item .alert-content p {
            margin: 0;
            font-size: 11px;
            color: #6c757d;
        }

        .alert-item .alert-time {
            margin-left: auto;
            font-size: 11px;
            color: #999;
            white-space: nowrap;
        }

        .progress-wrapper {
            margin-bottom: 20px;
        }

        .progress-wrapper .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .progress-wrapper .progress-label span:first-child {
            color: #333;
            font-weight: 500;
        }

        .progress-wrapper .progress-label span:last-child {
            color: #6c757d;
        }

        .progress {
            height: 10px;
            border-radius: 5px;
            background: #e9ecef;
        }

        .progress-bar {
            border-radius: 5px;
        }

        /* 管理员首页在桌面端占满当前视口，预警内容只在卡片内部滚动 */
        @media (min-width: 992px) {
            body.fire-theme.global-dashboard-page {
                height: 100vh;
                min-height: 100vh;
                overflow: hidden;
            }

            body.fire-theme.global-dashboard-page .fire-dashboard {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 0;
                box-sizing: border-box;
                overflow: hidden;
            }

            body.fire-theme.global-dashboard-page .fire-header {
                flex: 0 0 auto;
            }

            body.fire-theme.global-dashboard-page #globalStatsBlock {
                display: flex;
                flex: 1 1 auto;
                flex-direction: column;
                min-height: 0;
            }

            body.fire-theme.global-dashboard-page #globalStatsBlock > .row:first-child {
                flex: 0 0 auto;
            }

            body.fire-theme.global-dashboard-page .dashboard-main-row {
                display: flex;
                flex: 1 1 auto;
                min-height: 0;
            }

            body.fire-theme.global-dashboard-page .dashboard-main-row > .col-md-6 {
                float: none;
                min-height: 0;
            }

            body.fire-theme.global-dashboard-page .overview-column {
                display: flex;
            }

            body.fire-theme.global-dashboard-page .overview-panel {
                flex: 1 1 auto;
                width: 100%;
                min-height: 0;
                margin-bottom: 0;
                overflow-y: auto;
            }

            body.fire-theme.global-dashboard-page .dashboard-side-column {
                display: flex;
                flex-direction: column;
            }

            body.fire-theme.global-dashboard-page .quick-panel {
                flex: 0 0 auto;
            }

            body.fire-theme.global-dashboard-page .alert-panel {
                display: flex;
                flex: 1 1 0;
                flex-direction: column;
                min-height: 0;
                margin-bottom: 0;
                overflow: hidden;
            }

            body.fire-theme.global-dashboard-page .alert-panel .panel-header {
                flex: 0 0 auto;
            }

            body.fire-theme.global-dashboard-page .alert-scroll-area {
                flex: 1 1 auto;
                min-height: 0;
                padding-right: 6px;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-gutter: stable;
            }

            body.fire-theme.global-dashboard-page .alert-scroll-area::-webkit-scrollbar {
                width: 6px;
            }

            body.fire-theme.global-dashboard-page .alert-scroll-area::-webkit-scrollbar-thumb {
                background: #c9ced6;
                border-radius: 3px;
            }

            body.fire-theme.global-dashboard-page .alert-scroll-area::-webkit-scrollbar-track {
                background: #f3f4f6;
                border-radius: 3px;
            }
        }

        @media (max-width: 768px) {
            .fire-header h1 {
                font-size: 20px;
            }

            .stat-card .stat-number {
                font-size: 32px;
            }
        }

        #personalStatsRow .stat-card-clickable,
        #globalStatsBlock .stat-card-clickable {
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #personalStatsRow .stat-card-clickable:hover,
        #globalStatsBlock .stat-card-clickable:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
        }

        #personalStatsRow .stat-card-clickable:active,
        #globalStatsBlock .stat-card-clickable:active {
            transform: translateY(-1px);
        }

        #personalStatsRow .stat-card-clickable:focus,
        #globalStatsBlock .stat-card-clickable:focus {
            outline: 2px solid rgba(220, 53, 69, 0.45);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            #personalStatsRow .stat-card-clickable,
            #personalStatsRow .stat-card-clickable:hover,
            #personalStatsRow .stat-card-clickable:active,
            #globalStatsBlock .stat-card-clickable,
            #globalStatsBlock .stat-card-clickable:hover,
            #globalStatsBlock .stat-card-clickable:active {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>

<body class="fire-theme"
    th:classappend="${homeScope == 'global'} ? ' global-dashboard-page' : ' personal-dashboard-page'">
    <div class="fire-dashboard">
        <!-- 头部 -->
        <div class="fire-header">
            <div class="row">
                <div class="col-sm-8">
                    <h1><i class="fa fa-fire"></i> 消防设备管理系统</h1>
                    <div class="header-info">
                        <i class="fa fa-clock-o"></i> 系统运行状态：正常 |
                        <i class="fa fa-user"></i> 欢迎您，<span
                            th:text="${displayName}">管理员</span> |
                        <i class="fa fa-calendar"></i> <span id="currentDate"></span>
                    </div>
                </div>
                <div class="col-sm-4 text-right">
                    <i class="fa fa-shield header-icon"></i>
                </div>
            </div>
        </div>

        <!-- 本人任务统计（普通维保人员） -->
        <div class="row" id="personalStatsRow" th:style="${homeScope == 'personal'} ? '' : 'display:none'">
            <div class="col-sm-6 col-md-2">
                <div class="stat-card card-warning stat-card-clickable" role="button" tabindex="0" aria-label="待处理任务"
                    onclick="openTaskDashboard('pending')" onkeydown="handleStatCardKey(event, 'pending')">
                    <i class="fa fa-hourglass-half stat-icon"></i>
                    <div class="stat-number" id="pendingCount">-</div>
                    <div class="stat-title">待处理</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-2">
                <div class="stat-card card-primary stat-card-clickable" role="button" tabindex="0" aria-label="进行中任务"
                    onclick="openTaskDashboard('doing')" onkeydown="handleStatCardKey(event, 'doing')">
                    <i class="fa fa-spinner stat-icon"></i>
                    <div class="stat-number" id="doingCount">-</div>
                    <div class="stat-title">进行中</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-2">
                <div class="stat-card card-success stat-card-clickable" role="button" tabindex="0" aria-label="今日任务"
                    onclick="openTaskDashboard('today')" onkeydown="handleStatCardKey(event, 'today')">
                    <i class="fa fa-calendar-check-o stat-icon"></i>
                    <div class="stat-number" id="todayCount">-</div>
                    <div class="stat-title">今日任务</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-2">
                <div class="stat-card card-success stat-card-clickable" role="button" tabindex="0" aria-label="已完成任务"
                    onclick="openTaskDashboard('completed')" onkeydown="handleStatCardKey(event, 'completed')">
                    <i class="fa fa-check-circle stat-icon"></i>
                    <div class="stat-number" id="doneCount">-</div>
                    <div class="stat-title">已完成</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-2">
                <div class="stat-card card-danger stat-card-clickable" role="button" tabindex="0" aria-label="已逾期任务"
                    onclick="openTaskDashboard('overdue')" onkeydown="handleStatCardKey(event, 'overdue')">
                    <i class="fa fa-exclamation-triangle stat-icon"></i>
                    <div class="stat-number" id="overdueCount">-</div>
                    <div class="stat-title">已逾期</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-2">
                <div class="stat-card card-primary stat-card-clickable" role="button" tabindex="0" aria-label="本人全部任务"
                    onclick="openTaskDashboard('mine')" onkeydown="handleStatCardKey(event, 'mine')">
                    <i class="fa fa-tasks stat-icon"></i>
                    <div class="stat-number" id="totalCount">-</div>
                    <div class="stat-title">本人任务</div>
                </div>
            </div>
        </div>
        <div class="row" id="personalQuickRow" th:style="${homeScope == 'personal'} ? '' : 'display:none'">
            <div class="col-md-12">
                <div class="info-panel">
                    <div class="panel-header">
                        <i class="fa fa-th-large"></i>
                        <h3>快捷入口</h3>
                    </div>
                    <div class="row">
                        <div class="col-xs-6 col-sm-3">
                            <a href="javascript:void(0)" onclick="openTaskDashboard('mine')" class="quick-entry">
                                <i class="fa fa-tasks"></i>
                                <span>我的维保任务</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 全局统计（管理员） -->
        <div id="globalStatsBlock" th:style="${homeScope == 'global'} ? '' : 'display:none'">
        <div class="row">
            <div class="col-sm-6 col-md-3">
                <div class="stat-card card-primary stat-card-clickable" role="button" tabindex="0" aria-label="公司总数"
                    onclick="openInfoMenu('/fire/company', '公司信息')"
                    onkeydown="handleInfoCardKey(event, '/fire/company', '公司信息')">
                    <i class="fa fa-building stat-icon"></i>
                    <div class="stat-number" id="companyCount">-</div>
                    <div class="stat-title">公司总数</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="stat-card card-success stat-card-clickable" role="button" tabindex="0" aria-label="建筑总数"
                    onclick="openInfoMenu('/fire/building', '建筑信息')"
                    onkeydown="handleInfoCardKey(event, '/fire/building', '建筑信息')">
                    <i class="fa fa-building-o stat-icon"></i>
                    <div class="stat-number" id="buildingCount">-</div>
                    <div class="stat-title">建筑总数</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="stat-card card-warning stat-card-clickable" role="button" tabindex="0" aria-label="设备总数"
                    onclick="openEquipmentDashboard('')"
                    onkeydown="handleEquipmentCardKey(event, '')">
                    <i class="fa fa-fire-extinguisher stat-icon"></i>
                    <div class="stat-number" id="equipmentCount">-</div>
                    <div class="stat-title">设备总数</div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="stat-card card-danger stat-card-clickable" role="button" tabindex="0" aria-label="即将过期"
                    onclick="openEquipmentDashboard('expiringSoon')"
                    onkeydown="handleEquipmentCardKey(event, 'expiringSoon')">
                    <i class="fa fa-exclamation-triangle stat-icon"></i>
                    <div class="stat-number" id="expiringSoonCount">-</div>
                    <div class="stat-title">即将过期</div>
                </div>
            </div>
        </div>

        <div class="row dashboard-main-row">
            <!-- 设备状态概览 -->
            <div class="col-md-6 overview-column">
                <div class="info-panel overview-panel">
                    <div class="panel-header">
                        <i class="fa fa-pie-chart"></i>
                        <h3>设备状态概览</h3>
                    </div>
                    <div class="status-item">
                        <div class="status-icon bg-success">
                            <i class="fa fa-check"></i>
                        </div>
                        <div class="status-info">
                            <h4>有效期内</h4>
                            <p>设备在有效期内正常</p>
                        </div>
                        <div class="status-count text-success" id="inDateCount">-</div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon bg-warning">
                            <i class="fa fa-exclamation"></i>
                        </div>
                        <div class="status-info">
                            <h4>即将过期</h4>
                            <p>30天内将到期，请及时处理</p>
                        </div>
                        <div class="status-count text-warning" id="expiringSoonCountDetail">-</div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon bg-danger">
                            <i class="fa fa-times"></i>
                        </div>
                        <div class="status-info">
                            <h4>已过期</h4>
                            <p>设备已超出有效期</p>
                        </div>
                        <div class="status-count text-danger" id="expiredCount">-</div>
                    </div>

                    <!-- 设备健康度 -->
                    <div style="margin-top: 25px;">
                        <h4 style="font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #333;">
                            <i class="fa fa-heartbeat" style="color: var(--fire-red);"></i> 设备健康度
                        </h4>
                        <div class="progress-wrapper">
                            <div class="progress-label">
                                <span>有效期内占比</span>
                                <span id="inDatePercent">0%</span>
                            </div>
                            <div class="progress">
                                <div id="inDatePercentBar" class="progress-bar bg-success" role="progressbar"
                                    style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="progress-wrapper">
                            <div class="progress-label">
                                <span>即将过期占比</span>
                                <span id="expiringSoonPercent">0%</span>
                            </div>
                            <div class="progress">
                                <div id="expiringSoonPercentBar" class="progress-bar bg-warning" role="progressbar"
                                    style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="progress-wrapper">
                            <div class="progress-label">
                                <span>已过期占比</span>
                                <span id="expiredPercent">0%</span>
                            </div>
                            <div class="progress">
                                <div id="expiredPercentBar" class="progress-bar bg-danger" role="progressbar"
                                    style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 快捷入口 + 预警 -->
            <div class="col-md-6 dashboard-side-column">
                <div class="info-panel quick-panel">
                    <div class="panel-header">
                        <i class="fa fa-th-large"></i>
                        <h3>快捷入口</h3>
                    </div>
                    <div class="row">
                        <div class="col-xs-6 col-sm-3">
                            <a href="javascript:void(0)" onclick="openMenu('/fire/company', '公司信息')"
                                class="quick-entry">
                                <i class="fa fa-building"></i>
                                <span>公司信息</span>
                            </a>
                        </div>
                        <div class="col-xs-6 col-sm-3">
                            <a href="javascript:void(0)" onclick="openMenu('/fire/building', '建筑信息')"
                                class="quick-entry">
                                <i class="fa fa-building-o"></i>
                                <span>建筑信息</span>
                            </a>
                        </div>
                        <div class="col-xs-6 col-sm-3">
                            <a href="javascript:void(0)" onclick="openMenu('/fire/equipment', '设备信息')"
                                class="quick-entry">
                                <i class="fa fa-fire-extinguisher"></i>
                                <span>设备信息</span>
                            </a>
                        </div>
                        <div class="col-xs-6 col-sm-3">
                            <a href="javascript:void(0)" onclick="openMenu('/fire/task', '维保任务')" class="quick-entry">
                                <i class="fa fa-tasks"></i>
                                <span>维保任务</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 预警列表 -->
                <div class="info-panel alert-panel">
                    <div class="panel-header">
                        <i class="fa fa-bell"></i>
                        <h3>设备预警</h3>
                    </div>

                    <div class="alert-scroll-area">
                        <div id="alertListContainer">
                            <!-- 动态插入 -->
                        </div>

                        <div id="noAlert" style="text-align:center; padding:30px; color:#999; display:none;">
                            <i class="fa fa-check-circle fa-3x" style="color:#28a745;"></i>
                            <p style="margin-top:10px;">暂无预警信息</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div><!-- /globalStatsBlock -->
    </div>

    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/ruoyi/js/ry-ui.js}"></script>

    <script>
        var ctx = "/";

        function updateDateTime() {
            var now = new Date();
            var dateStr = now.getFullYear() + '-' +
                ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
                ('0' + now.getDate()).slice(-2) + ' ' +
                ('0' + now.getHours()).slice(-2) + ':' +
                ('0' + now.getMinutes()).slice(-2) + ':' +
                ('0' + now.getSeconds()).slice(-2);
            document.getElementById('currentDate').textContent = dateStr;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // 加载数据
        $(function () {
            loadStats();
        });

        function loadStats() {
            $.ajax({
                url: ctx + "fire/stats/home",
                type: "get",
                dataType: "json",
                success: function (res) {
                    console.log("AJAX Success:", res);
                    if (res.code == 0 || res.code == 200) {
                        if (res.scope === 'personal') {
                            $("#pendingCount").text(res.pendingCount != null ? res.pendingCount : 0);
                            $("#doingCount").text(res.doingCount != null ? res.doingCount : 0);
                            $("#todayCount").text(res.todayCount != null ? res.todayCount : 0);
                            $("#doneCount").text(res.doneCount != null ? res.doneCount : 0);
                            $("#overdueCount").text(res.overdueCount != null ? res.overdueCount : 0);
                            $("#totalCount").text(res.totalCount != null ? res.totalCount : 0);
                            return;
                        }
                        // 顶部卡片
                        $("#companyCount").text(res.companyCount);
                        $("#buildingCount").text(res.buildingCount);
                        $("#equipmentCount").text(res.equipmentCount);
                        $("#expiringSoonCount").text(res.expiringSoonCount);

                        // 状态概览
                        $("#inDateCount").text(res.inDateCount);
                        $("#expiringSoonCountDetail").text(res.expiringSoonCount);
                        $("#expiredCount").text(res.expiredCount);

                        // 进度条
                        $("#inDatePercent").text(res.inDatePercent + "%");
                        $("#inDatePercentBar").css("width", res.inDatePercent + "%");

                        $("#expiringSoonPercent").text(res.expiringSoonPercent + "%");
                        $("#expiringSoonPercentBar").css("width", res.expiringSoonPercent + "%");

                        $("#expiredPercent").text(res.expiredPercent + "%");
                        $("#expiredPercentBar").css("width", res.expiredPercent + "%");

                        // 预警列表
                        var html = "";
                        var hasAlerts = false;

                        // 已过期
                        if (res.expiredList && res.expiredList.length > 0) {
                            hasAlerts = true;
                            $.each(res.expiredList, function (i, item) {
                                html += `
                                <div class="alert-item">
                                    <div class="alert-icon"><i class="fa fa-times"></i></div>
                                    <div class="alert-content">
                                        <h5>${item.equipmentName}</h5>
                                        <p><span>${item.buildingName}</span> - 已过期</p>
                                    </div>
                                    <div class="alert-time">${item.expireDate ? item.expireDate.substring(5, 10) : ''}</div>
                                </div>`;
                            });
                        }

                        // 即将过期
                        if (res.expiringSoonList && res.expiringSoonList.length > 0) {
                            hasAlerts = true;
                            $.each(res.expiringSoonList, function (i, item) {
                                html += `
                                <div class="alert-item warning-type">
                                    <div class="alert-icon"><i class="fa fa-exclamation"></i></div>
                                    <div class="alert-content">
                                        <h5>${item.equipmentName}</h5>
                                        <p><span>${item.buildingName}</span> - 即将过期</p>
                                    </div>
                                    <div class="alert-time">${item.expireDate ? item.expireDate.substring(5, 10) : ''}</div>
                                </div>`;
                            });
                        }

                        $("#alertListContainer").html(html);
                        if (!hasAlerts) {
                            $("#noAlert").show();
                        }
                    } else {
                        console.error("加载数据失败: " + res.msg);
                    }
                },
                error: function (xhr) {
                    console.error("系统错误");
                },
                complete: function () {
                    $("#loadingMask").fadeOut();
                    $("#dashboardContent").fadeIn();
                }
            });
        }

        // 快捷入口跳转：交给若依 openMenu 管理页签，筛选通过 sessionStorage + postMessage 传递
        var TASK_MENU_BASE = '/fire/task';
        var TASK_MENU_TITLE = '维保任务';
        var TASK_DASHBOARD_FILTERS = ['pending', 'doing', 'today', 'completed', 'overdue', 'mine'];
        var TASK_FILTER_STORAGE_KEY = 'fireTaskDashboardFilter';
        var TASK_FILTER_MSG_TYPE = 'fire-task-dashboard-filter';

        var EQUIP_MENU_BASE = '/fire/equipment';
        var EQUIP_MENU_TITLE = '设备信息';
        var EQUIP_FILTER_STORAGE_KEY = 'fireEquipmentExpireFilter';
        var EQUIP_FILTER_MSG_TYPE = 'fire-equipment-expire-filter';

        function normalizeTaskDashboardFilter(filter) {
            if (TASK_DASHBOARD_FILTERS.indexOf(filter) >= 0) {
                return filter;
            }
            return 'mine';
        }

        function normalizeExpireFilter(filter) {
            if (filter === 'expiringSoon') {
                return 'expiringSoon';
            }
            return '';
        }

        function handleStatCardKey(e, filter) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openTaskDashboard(filter);
            }
        }

        function handleInfoCardKey(e, url, title) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openInfoMenu(url, title);
            }
        }

        function handleEquipmentCardKey(e, filter) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openEquipmentDashboard(filter);
            }
        }

        function showNoPermissionTip(message) {
            var tip = message || '暂无访问权限';
            if (typeof $.modal !== 'undefined' && $.modal.msgWarning) {
                $.modal.msgWarning(tip);
            } else {
                alert(tip);
            }
        }

        function hasMenuPermission(url) {
            try {
                var parentDoc = window.parent.document;
                var menuItems = parentDoc.querySelectorAll('a.menuItem');
                for (var i = 0; i < menuItems.length; i++) {
                    var href = menuItems[i].getAttribute('href');
                    if (href && (href === url || href.endsWith(url))) {
                        return true;
                    }
                }
            } catch (e) {
                console.error('检查菜单权限失败:', e);
            }
            return false;
        }

        function hasTaskMenuPermission() {
            return hasMenuPermission(TASK_MENU_BASE);
        }

        function findMenuIframe(menuBase) {
            try {
                var parentDoc = window.parent && window.parent.document;
                if (!parentDoc) {
                    return null;
                }
                var iframes = parentDoc.querySelectorAll('iframe.RuoYi_iframe');
                for (var i = 0; i < iframes.length; i++) {
                    var dataId = iframes[i].getAttribute('data-id') || '';
                    if (dataId === menuBase || dataId.endsWith(menuBase)) {
                        return iframes[i];
                    }
                }
            } catch (e) {
                console.warn('查找菜单 iframe 失败:', e);
            }
            return null;
        }

        function findTaskIframe() {
            return findMenuIframe(TASK_MENU_BASE);
        }

        function findEquipmentIframe() {
            return findMenuIframe(EQUIP_MENU_BASE);
        }

        function isIframeDocumentReady(iframe) {
            try {
                var doc = iframe.contentWindow && iframe.contentWindow.document;
                if (!doc) {
                    return false;
                }
                var href = '';
                try {
                    href = iframe.contentWindow.location.href || '';
                } catch (e) {
                    return false;
                }
                if (!href || href === 'about:blank') {
                    return false;
                }
                return doc.readyState === 'interactive' || doc.readyState === 'complete';
            } catch (e) {
                return false;
            }
        }

        function isTaskIframeDocumentReady(iframe) {
            return isIframeDocumentReady(iframe);
        }

        function postFilterToTaskIframe(filter) {
            try {
                var iframe = findTaskIframe();
                if (!iframe || !iframe.contentWindow || !isTaskIframeDocumentReady(iframe)) {
                    return false;
                }
                iframe.contentWindow.postMessage({
                    type: TASK_FILTER_MSG_TYPE,
                    filter: filter
                }, window.location.origin);
                return true;
            } catch (e) {
                console.warn('向维保任务页发送筛选消息失败:', e);
                return false;
            }
        }

        function postExpireFilterToEquipmentIframe(filter) {
            try {
                var iframe = findEquipmentIframe();
                if (!iframe || !iframe.contentWindow || !isIframeDocumentReady(iframe)) {
                    return false;
                }
                iframe.contentWindow.postMessage({
                    type: EQUIP_FILTER_MSG_TYPE,
                    filter: filter
                }, window.location.origin);
                return true;
            } catch (e) {
                console.warn('向设备信息页发送筛选消息失败:', e);
                return false;
            }
        }

        function notifyTaskFilterOnce(filter) {
            if (postFilterToTaskIframe(filter)) {
                return;
            }
            var iframe = findTaskIframe();
            if (iframe) {
                var onLoad = function () {
                    iframe.removeEventListener('load', onLoad);
                    postFilterToTaskIframe(filter);
                };
                iframe.addEventListener('load', onLoad);
            }
            var attempts = 0;
            var timer = setInterval(function () {
                attempts++;
                if (postFilterToTaskIframe(filter) || attempts >= 10) {
                    clearInterval(timer);
                }
            }, 200);
        }

        function notifyEquipmentFilterOnce(filter) {
            if (postExpireFilterToEquipmentIframe(filter)) {
                return;
            }
            var iframe = findEquipmentIframe();
            if (iframe) {
                var onLoad = function () {
                    iframe.removeEventListener('load', onLoad);
                    postExpireFilterToEquipmentIframe(filter);
                };
                iframe.addEventListener('load', onLoad);
            }
            var attempts = 0;
            var timer = setInterval(function () {
                attempts++;
                if (postExpireFilterToEquipmentIframe(filter) || attempts >= 10) {
                    clearInterval(timer);
                }
            }, 200);
        }

        function openTaskDashboard(filter) {
            filter = normalizeTaskDashboardFilter(filter);
            if (!hasTaskMenuPermission()) {
                showNoPermissionTip('暂无访问权限');
                return;
            }
            try {
                sessionStorage.setItem(TASK_FILTER_STORAGE_KEY, filter);
            } catch (e) {
                console.warn('写入任务筛选缓存失败:', e);
            }
            // 仅通过若依菜单点击切换页签，禁止手动改 iframe CSS
            openMenu(TASK_MENU_BASE, TASK_MENU_TITLE);
            notifyTaskFilterOnce(filter);
        }

        function openInfoMenu(url, title) {
            if (!hasMenuPermission(url)) {
                showNoPermissionTip('暂无访问权限');
                return;
            }
            openMenu(url, title);
        }

        function openEquipmentDashboard(filter) {
            filter = normalizeExpireFilter(filter);
            if (!hasMenuPermission(EQUIP_MENU_BASE)) {
                showNoPermissionTip('暂无访问权限');
                return;
            }
            try {
                sessionStorage.setItem(EQUIP_FILTER_STORAGE_KEY, filter);
            } catch (e) {
                console.warn('写入设备到期筛选缓存失败:', e);
            }
            openMenu(EQUIP_MENU_BASE, EQUIP_MENU_TITLE);
            notifyEquipmentFilterOnce(filter);
        }

        function openMenu(url, title) {
            try {
                // 在父窗口中查找对应的菜单项并点击
                var parentDoc = window.parent.document;
                var menuItems = parentDoc.querySelectorAll('a.menuItem');
                var found = false;

                for (var i = 0; i < menuItems.length; i++) {
                    var href = menuItems[i].getAttribute('href');
                    // 精确匹配URL
                    if (href && (href === url || href.endsWith(url))) {
                        // 先展开父级菜单
                        var parentLi = menuItems[i].closest('li');
                        if (parentLi) {
                            var parentUl = parentLi.closest('ul.nav-second-level, ul.nav-third-level');
                            if (parentUl) {
                                parentUl.classList.add('in');
                                var parentLiTop = parentUl.closest('li');
                                if (parentLiTop) {
                                    parentLiTop.classList.add('active');
                                }
                            }
                        }
                        // 模拟点击菜单
                        menuItems[i].click();
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    console.warn('未找到菜单项: ' + url + (title ? (' (' + title + ')') : ''));
                    showNoPermissionTip('暂无访问权限');
                }
            } catch (e) {
                console.error('跳转失败:', e);
            }
        }
    </script>
</body>

</html>
